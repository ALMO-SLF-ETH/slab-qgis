# The slab-sweep engine bundled into the plugin zip (slab_qgis/_vendor/).
#
# scripts/build_plugin.py downloads this wheel from the slab-sweep GitHub release and checks its
# SHA-256 before unpacking it. The bump-engine workflow updates this file in a pull request when
# slab-sweep publishes a release. An empty version means "no release pinned yet": builds then
# need --engine-wheel (CI builds one from the slab-sweep checkout).

[slab-sweep]
version = "0.1.0"
wheel = "slab_sweep-0.1.0-py3-none-any.whl"
sha256 = "4899342c40b095f4972547390c2c8158a770253639bc0fafa9078839c66989b8"
